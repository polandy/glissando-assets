:root { --bg:#FDF8F2; --surface:#FFFFFF; --text:#2A2340; --outline:#2A2340; --word:#2A2340;
  --peach:#FFB59A; --mint:#8FD9C4; --lemon:#FFD95A; --speed:1; color-scheme: light; }
:root[data-theme="dark"] { --bg:#171223; --surface:#2A2340; --text:#FDF8F2; --outline:#171223; --word:#FDF8F2; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text); font-family:"Baloo 2",sans-serif; font-weight:600;
  display:grid; grid-template-rows:1fr auto; transition: background .3s; }
.stage { display:grid; place-items:center; padding:24px; }
.stage svg { width:min(80vw, 420px); height:auto; overflow:visible; }
.controls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:16px 16px 28px; }
.seg { display:flex; background:var(--surface); border:2px solid var(--text); border-radius:18px; overflow:hidden; }
.seg button, .btn { font:inherit; color:var(--text); background:transparent; border:0; padding:8px 16px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--mint); color:#2A2340; }
.btn { background:var(--lemon); color:#2A2340; border:2px solid var(--text); border-radius:18px; }
.btn.ghost { background:var(--surface); color:var(--text); }
.hint { width:100%; text-align:center; font-size:14px; opacity:.75; margin:0; }

.a { transform-box: fill-box; transform-origin: center; }
.play .a { animation-duration: calc(var(--d, 600ms) * var(--speed)); animation-delay: calc(var(--t, 0ms) * var(--speed));
  animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.85,.3,1.15); }

/* A – Gleiten: Kärtchen gleiten nacheinander von links herein, der Schriftzug wird von links aufgedeckt */
.v-glide.play .card { animation-name: glide; }
.v-glide .c1 { --t:0ms; } .v-glide .c2 { --t:120ms; } .v-glide .c3 { --t:240ms; }
@keyframes glide { from { opacity:0; transform: translateX(-70px) rotate(-18deg); } to { opacity:1; transform:none; } }
.v-glide.play .motif { animation-name: pop; --t:620ms; --d:420ms; }
.v-glide.play .word { animation-name: reveal; --t:700ms; --d:700ms; animation-timing-function: cubic-bezier(.3,.7,.2,1); }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); transform: translateX(-12px); } to { clip-path: inset(0 0 0 0); transform:none; } }

/* B – Auffächern: die Kärtchen liegen als Stapel und fächern sich auf */
.v-fan.play .card { animation-name: fan; --d:700ms; }
.v-fan .c1 { --fx:60px; --fy:-30px; --fr:24deg; --t:150ms; } .v-fan .c2 { --fx:30px; --fy:-15px; --fr:12deg; --t:150ms; } .v-fan .c3 { --fx:0; --fy:0; --fr:0deg; --t:0ms; }
@keyframes fan { from { opacity:0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(.9); }
  25% { opacity:1; } to { opacity:1; transform:none; } }
.v-fan.play .motif { animation-name: pop; --t:650ms; --d:420ms; }
.v-fan.play .word { animation-name: rise; --t:750ms; --d:600ms; }
@keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }

/* C – Hinlegen: Kärtchen werden wie Fotos von oben auf den Tisch gelegt */
.v-drop.play .card { animation-name: drop; --d:520ms; }
.v-drop .c1 { --t:0ms; } .v-drop .c2 { --t:160ms; } .v-drop .c3 { --t:320ms; }
@keyframes drop { from { opacity:0; transform: translateY(-60px) rotate(8deg) scale(1.15); } to { opacity:1; transform:none; } }
.v-drop.play .motif { animation-name: pop; --t:760ms; --d:420ms; }
.v-drop.play .word { animation-name: settle; --t:820ms; --d:620ms; }
@keyframes settle { from { opacity:0; transform: scale(.9) rotate(3deg); } to { opacity:1; transform:none; } }

@keyframes pop { from { opacity:0; transform: scale(.4); } to { opacity:1; transform:none; } }
@keyframes fade { from { opacity:0; } to { opacity:1; } }

/* Bewegung reduzieren: nur weiches Einblenden */
@media (prefers-reduced-motion: reduce) {
  .play .a { animation-name: fade !important; --t:0ms !important; --d:400ms !important; }
}
:root.reduce .play .a { animation-name: fade !important; --t:0ms !important; --d:400ms !important; }
</style>

<div class="controls">
  <div class="seg" role="group" aria-label="Variante">
    <button data-v="v-glide" aria-pressed="true">A · Gleiten</button>
    <button data-v="v-fan" aria-pressed="false">B · Auffächern</button>
    <button data-v="v-drop" aria-pressed="false">C · Hinlegen</button>
  </div>
  <button class="btn" id="replay">↻ Nochmal</button>
  <button class="btn ghost" id="slow" aria-pressed="false">Zeitlupe</button>
  <button class="btn ghost" id="theme">Dunkel</button>
  <button class="btn ghost" id="reduce" aria-pressed="false">Bewegung reduziert</button>
  <p class="hint">Gesamtdauer ca. 1,4 s. „Bewegung reduziert“ zeigt, was Nutzer mit dieser Systemeinstellung sehen.</p>
</div>
<script>
const logo = document.getElementById("logo");
const root = document.documentElement;
function play() { logo.classList.remove("play"); void logo.getBoundingClientRect(); logo.classList.add("play"); }
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  logo.classList.remove("v-glide","v-fan","v-drop"); logo.classList.add(b.dataset.v); play();
}));
document.getElementById("replay").addEventListener("click", play);
document.getElementById("slow").addEventListener("click", e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on)); e.currentTarget.textContent = on ? "Normal" : "Zeitlupe";
  root.style.setProperty("--speed", on ? "3" : "1"); play();
});
document.getElementById("theme").addEventListener("click", e => {
  const dark = root.dataset.theme !== "dark"; root.dataset.theme = dark ? "dark" : "light";
  e.currentTarget.textContent = dark ? "Hell" : "Dunkel";
});
document.getElementById("reduce").addEventListener("click", e => {
  const on = root.classList.toggle("reduce"); e.currentTarget.setAttribute("aria-pressed", String(on));
  e.currentTarget.textContent = on ? "Bewegung normal" : "Bewegung reduziert"; play();
});
const v = new URLSearchParams(location.search).get("v"); if (v) document.querySelector(`[data-v="v-${v}"]`)?.click();
if (new URLSearchParams(location.search).get("theme") === "dark") document.getElementById("theme").click();
play();
</script>
