<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Pictures Emphasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page: #f3f2f6; --page-ink: #221d33; --page-muted: #6b6580; --page-line: #dedbe6; --page-card: #ffffff;
  --chip: #ebe9f1; --chip-on: #221d33; --chip-on-ink: #ffffff; --peach: #ff9f7f; --lemon: #f5c94a;
  --ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e0c14; --page-ink: #ece9f3; --page-muted: #8e88a0; --page-line: #2a2636; --page-card: #17141f;
    --chip: #211d2c; --chip-on: #ece9f3; --chip-on-ink: #17141f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e0c14; --page-ink: #ece9f3; --page-muted: #8e88a0; --page-line: #2a2636; --page-card: #17141f;
  --chip: #211d2c; --chip-on: #ece9f3; --chip-on-ink: #17141f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-ink); font: 14px var(--ui); }
.page { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }
h1 { font: 700 26px var(--display); margin: 0; letter-spacing: -0.01em; }
.intro p { margin: 4px 0 0; color: var(--page-muted); max-width: 74ch; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 9px; background: var(--chip); }
.seg button { border: 0; background: transparent; color: var(--page-ink); font: 500 13px var(--ui); padding: 6px 11px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.seg button:focus-visible, .app button:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }
.card { background: var(--page-card); border: 1px solid var(--page-line); border-radius: 12px; padding: 14px 18px; line-height: 1.55; max-width: 980px; }
.card b { font-family: var(--display); font-size: 16px; }
.card.rec { border-left: 3px solid var(--peach); }
.stage { display: grid; justify-items: center; }

.app {
  --radius: 10px; --radius-lg: 14px; --badge: rgba(20, 14, 30, 0.62);
  --ground: #f6f5f8; --surface: #ffffff; --ink: #221d33; --muted: #6b6580; --faint: #9c97ad;
  --line: #e5e2eb; --hover: #efedf3; --accent: #ff9f7f; --accent-ink: #2a1a14; --accent-soft: #fff0ea; --accent-line: #ffc9b6;
  --mint: #3fae8f; --shimmer: #ebe9f0;
  width: 100%; max-width: 1100px; height: 760px; overflow: hidden; display: flex; flex-direction: column;
  border-radius: 16px; border: 1px solid var(--line); background: var(--ground); color: var(--ink);
  box-shadow: 0 20px 60px rgba(20, 14, 40, 0.14); font: 14px var(--ui);
}
.app.phone { max-width: 424px; height: 880px; border-radius: 36px; border: 6px solid #1a1722; }
.app.dark {
  --ground: #121019; --surface: #1a1723; --ink: #edeaf3; --muted: #9a94ab; --faint: #6c6680;
  --line: #2c2838; --hover: #26222f; --accent: #ffb59a; --accent-ink: #2a1a14; --accent-soft: #2e1f1b; --accent-line: #6b3f31;
  --mint: #6fcfb4; --shimmer: #24202d; color-scheme: dark;
}
.app button { font-family: inherit; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.top { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; font-weight: 600; }
.body { flex: 1; overflow: auto; padding: 18px 16px 12px; display: grid; gap: 14px; align-content: start; }
.app:not(.phone) .body { padding: 22px 32px; }
.steps { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 500; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; border: 1px solid var(--line); }
.dot.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.steps .bar { width: 36px; height: 2px; background: var(--line); }
h2 { font: 700 26px var(--display); margin: 2px 0 0; letter-spacing: -0.01em; }
.lead { margin: -6px 0 0; color: var(--muted); line-height: 1.5; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--ui); cursor: pointer; white-space: nowrap; }
.btn.sm { height: 34px; padding: 0 11px; font-size: 13px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(0.97); }
.btn.tint { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); font-weight: 600; }
.btn.tint svg { color: var(--accent-ink); }
.app.dark .btn.tint svg { color: var(--accent); }
.btn.wide { width: 100%; height: 46px; font-weight: 600; }
.btn .caret { margin-left: 2px; opacity: 0.7; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; display: grid; gap: 10px; }
.qhead { display: flex; justify-content: space-between; gap: 8px; }
.mono { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.row .name { flex: 1; }
.x { width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.meter { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--mint); border-radius: 3px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.drop { border: 1.5px dashed var(--accent-line); background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.drop .txt { flex: 1; display: grid; gap: 2px; }
.drop .txt b { font-weight: 600; }
.drop .txt span { color: var(--muted); font-size: 13px; }
.shead { display: flex; align-items: center; gap: 8px; }
.shead .t { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.shead .n { margin-left: auto; color: var(--muted); }
.order { color: var(--muted); margin-top: -6px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.app:not(.phone) .grid { grid-template-columns: repeat(6, 1fr); }
.tile { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; }
.tile .num { position: absolute; top: 6px; left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--badge); color: #fff; font: 500 12px var(--mono); }
.tile.ph { background: linear-gradient(100deg, var(--shimmer) 30%, var(--hover) 50%, var(--shimmer) 70%); background-size: 300% 100%; animation: sh 1.6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .tile.ph { animation: none; } }
@keyframes sh { from { background-position: 100% 0; } to { background-position: -200% 0; } }
.tile.add { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); display: grid; place-content: center; justify-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.tile.add.strong { border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.foot { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); }
.foot .why { color: var(--muted); flex: 1; }
.foot .next { flex: 0 0 46%; height: 46px; }
.foot .next[disabled] { opacity: 0.45; cursor: default; }
.menu { position: relative; display: inline-block; }
.pop { position: absolute; top: 42px; left: 0; z-index: 3; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(20, 14, 40, 0.18); padding: 4px; display: grid; min-width: 180px; }
.pop button { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; color: var(--ink); padding: 9px 10px; border-radius: 7px; font-size: 14px; text-align: left; cursor: pointer; }
.pop button:hover { background: var(--hover); }
</style>
</head>
<body>
<div class="page">
  <div class="intro">
    <h1>Add pictures — making it stand out</h1>
    <p>Four ways to give "Add pictures" more weight in the pictures step, in the existing Sorbet language. Each works while importing and once done; tap "Add pictures" to see its files/folder menu. Generated tiles only.</p>
  </div>
  <div class="controls">
    <div class="seg" id="variant" role="group" aria-label="Variant"></div>
    <div class="seg" id="state" role="group" aria-label="State"></div>
    <div class="seg" id="device" role="group" aria-label="Device"></div>
    <div class="seg" id="theme" role="group" aria-label="Theme"></div>
  </div>
  <div class="card" id="note"></div>
  <div class="stage"><div id="app"></div></div>
</div>
<script>
const ICON = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  files: '<rect x="7" y="7" width="12" height="13" rx="2"/><path d="M5 16V6a2 2 0 0 1 2-2h9"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  shuffle: '<path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M18 4l2 3-2 3M18 14l2 3-2 3"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  down: '<path d="M7 10l5 5 5-5"/>',
  cloud: '<path d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4 4 0 0 1 0 9z"/>',
};
const icon = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

const VARIANTS = {
  A: { label: "A · Like the editor", note: "<b>A · Like the editor (recommended)</b><br>The step takes the editor's two add points: a bordered “+ Add pictures” in the strip head next to Shuffle and Select (where the editor has “+ Add media”), and the dashed add tile after the last picture or placeholder. The queue panel only reports progress. Familiar from the editor, always next to the pictures, and the add tile stays in reach at the end of a long strip." },
  B: { label: "B · Tinted button", note: "<b>B · Tinted button</b><br>“Add pictures” stays in the queue panel, but as a full-width button tinted in soft peach with a peach plus — a step below the primary Next, clearly above the plain buttons. Strong on a phone; on a desktop it is a wide bar." },
  C: { label: "C · Mini drop zone", note: "<b>C · Mini drop zone</b><br>The panel opens with a slim dashed peach zone “Add more pictures · or drop them here” with the button inside — the empty step's drop zone, shrunk. Says that dropping still works mid-import; takes the most room." },
  D: { label: "D · Tinted tile", note: "<b>D · Tinted tile in the strip</b><br>Only the strip's last tile adds: the editor's add tile, tinted peach so it reads as an action; the panel keeps a small text link. Lightest panel, but the tile scrolls out of sight with many pictures." },
};
const S = { variant: "A", state: "importing", device: "phone", theme: "light", menu: false };

function seg(id, opts) {
  const el = document.getElementById(id);
  el.innerHTML = Object.entries(opts).map(([k, v]) => `<button type="button" data-k="${id}" data-v="${k}" aria-pressed="${S[id] === k}">${v}</button>`).join("");
}
function hue(i) { return [345, 25, 50, 130, 190, 230, 285, 320, 10, 160, 260, 40][i % 12]; }
function tile(i) {
  const h = hue(i);
  return `<div class="tile" style="background: linear-gradient(135deg, hsl(${h} 80% 60%), hsl(${(h + 50) % 360} 75% 45%))"><span class="num">${i + 1}</span></div>`;
}
function addMenu(cls, label = "Add pictures") {
  const pop = S.menu ? `<div class="pop" role="menu"><button role="menuitem">${icon("files")}Pictures and videos</button><button role="menuitem">${icon("folder")}A folder</button></div>` : "";
  return `<span class="menu"><button type="button" class="btn ${cls}" data-act="menu" aria-expanded="${S.menu}">${icon("plus")}${label}${icon("down", "i caret")}</button>${pop}</span>`;
}
function queue() {
  if (S.state !== "importing") return `<div><b>32 pictures</b> <span style="color:var(--muted)">· 01/01/2026 to 02/02/2026</span></div>`;
  return `<div class="qhead"><span>Importing · 18 of 32 ready</span><span class="mono">14 left</span></div>
    <div class="row">${icon("folder")}<span class="name">Holiday</span><span class="mono">16 ✓</span></div>
    <div class="row">${icon("folder")}<span class="name">Garden</span><span class="mono">2 / 16</span><button class="x" aria-label="Stop importing Garden">${icon("x")}</button></div>
    <div class="meter"><i style="width:56%"></i></div>`;
}
function panel() {
  const v = S.variant;
  let top = "";
  if (v === "B") top = `<div class="actions" style="display:grid">${addMenu("tint wide")}</div>`;
  if (v === "C") top = `<div class="drop"><div class="txt"><b>Add more pictures</b><span>or drop them here — they join the import</span></div>${addMenu("tint")}</div>`;
  if (v === "D") top = `<div><button class="btn sm" style="border:0;background:transparent;padding:0;color:var(--muted);text-decoration:underline">+ add more</button></div>`;
  return `<div class="panel">${top}${queue()}</div>`;
}
function strip() {
  const ready = S.state === "importing" ? 18 : 32;
  const shown = S.device === "phone" ? 8 : 16;
  const ph = S.state === "importing" ? (S.device === "phone" ? 3 : 5) : 0;
  let tiles = Array.from({ length: Math.min(ready, shown) }, (_, i) => tile(i)).join("");
  tiles += Array.from({ length: ph }, () => `<div class="tile ph" aria-hidden="true"></div>`).join("");
  if (S.variant === "A" || S.variant === "D") {
    tiles += `<button class="tile add ${S.variant === "D" ? "strong" : ""}" type="button">${icon("plus")}Add pictures</button>`;
  }
  const headAdd = S.variant === "A" ? addMenu("sm") : "";
  const order = S.state === "importing" ? "Capture order · new pictures are sorted in by date" : "Capture order";
  return `<div class="shead"><span class="t">PICTURES</span><span class="n">${ready}</span>
      <button class="btn sm">${icon("shuffle")}Shuffle</button><button class="btn sm">${icon("check")}Select</button>${headAdd}</div>
    <div class="order">${order}</div><div class="grid">${tiles}</div>`;
}
function render() {
  for (const [id, opts] of [["variant", Object.fromEntries(Object.entries(VARIANTS).map(([k, v]) => [k, v.label]))], ["state", { importing: "Importing", done: "Done" }], ["device", { phone: "Phone", desktop: "Desktop" }], ["theme", { light: "Light", dark: "Dark" }]]) seg(id, opts);
  const note = document.getElementById("note");
  note.innerHTML = VARIANTS[S.variant].note;
  note.classList.toggle("rec", S.variant === "A");
  const busy = S.state === "importing";
  document.getElementById("app").outerHTML = `<div id="app" class="app ${S.device === "phone" ? "phone" : ""} ${S.theme === "dark" ? "dark" : ""}">
    <div class="top">${icon("back")}Pictures</div>
    <div class="body">
      <div class="steps"><span class="dot on">1</span><b style="color:var(--ink)">Pictures</b><span class="bar"></span><span class="dot">2</span>Music</div>
      <h2>Which pictures?</h2>
      <p class="lead">Glissando sorts them by capture date and downsizes them for the device. Your originals stay untouched.</p>
      ${panel()}${strip()}
    </div>
    <div class="foot">${busy ? '<span class="why">14 still importing</span>' : '<span class="why"></span>'}<button class="btn">Cancel</button><button class="btn primary next" ${busy ? "disabled" : ""}>Next</button></div>
  </div>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) { if (S.menu) { S.menu = false; render(); } return; }
  if (b.dataset.k) { S[b.dataset.k] = b.dataset.v; S.menu = false; render(); return; }
  if (b.dataset.act === "menu") { S.menu = !S.menu; render(); return; }
  if (S.menu) { S.menu = false; render(); }
});
render();
</script>
</body>
</html>
